services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: get2learn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: get2learn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - get2learn-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d get2learn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  get2learn-postgres-data:
